<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What to do?</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="What to do?">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1EEF8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column — mode switch, the pick "ticket", filters, then the editable list */
:root {
  --bg: #F1EEF8;
  --surface: #FFFFFF;
  --ink: #221B35;
  --muted: #6B6380;
  --line: #DCD5EA;
  --accent: #D6336C;
  --accent-ink: #FFFFFF;
  --sun: #F4A623;
  --chip: #E8E2F3;
  --chip-on: #221B35;
  --chip-on-ink: #FFFFFF;
  --shadow: 0 1px 0 #DCD5EA, 0 10px 30px -18px rgba(34,27,53,.45);
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131F; --surface: #221C2E; --ink: #F1ECFA; --muted: #A79DBB; --line: #3A3149;
    --accent: #F0628F; --accent-ink: #1A0F16; --sun: #F6B648; --chip: #2E2640;
    --chip-on: #F1ECFA; --chip-on-ink: #17131F;
    --shadow: 0 1px 0 #3A3149, 0 10px 30px -18px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131F; --surface: #221C2E; --ink: #F1ECFA; --muted: #A79DBB; --line: #3A3149;
  --accent: #F0628F; --accent-ink: #1A0F16; --sun: #F6B648; --chip: #2E2640;
  --chip-on: #F1ECFA; --chip-on-ink: #17131F;
  --shadow: 0 1px 0 #3A3149, 0 10px 30px -18px rgba(0,0,0,.8);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: flex; flex-direction: column; gap: 28px; }

header { display: flex; flex-direction: column; gap: 6px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.6rem, 9vw, 3.6rem); line-height: 1; margin: 0; letter-spacing: -.01em; }
h1 .q { color: var(--accent); display: inline-block; transform: rotate(8deg); }
.sub { margin: 0; color: var(--muted); }

.modes { display: grid; grid-template-columns: 1fr 1fr; background: var(--chip); border-radius: 999px; padding: 4px; gap: 4px; }
.modes button { border: 0; background: transparent; color: var(--ink); font: 600 1rem var(--body); padding: 10px 12px; border-radius: 999px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); }

/* The ticket */
.ticket { position: relative; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 18px; align-items: stretch; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); transform: translateY(-50%); }
.ticket::before { left: -11px; } .ticket::after { right: -11px; }
.ticket-label { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.result { min-height: 3.4em; display: flex; flex-direction: column; justify-content: center; gap: 8px; border-bottom: 2px dashed var(--line); padding-bottom: 18px; }
.result-name { font-family: var(--display); font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.1; margin: 0; text-wrap: balance; }
.result-name.idle { color: var(--muted); font-size: 1.4rem; }
.result-name.rolling { color: var(--muted); }
.result-tags { display: flex; flex-wrap: wrap; gap: 6px; min-height: 1.6em; }
.tag { font-size: .78rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--chip); color: var(--ink); }
.result-meta { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.go { border: 0; background: var(--accent); color: var(--accent-ink); font: 700 1.15rem var(--body); padding: 16px 20px; border-radius: 14px; cursor: pointer; transition: transform .12s ease; }
.go:hover { transform: translateY(-1px); }
.go:active { transform: translateY(1px); }

/* Filters */
.filters { display: flex; flex-direction: column; gap: 14px; }
.filters-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; }
.group { display: flex; flex-direction: column; gap: 6px; }
.group-name { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 .92rem var(--body); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
.link { border: 0; background: none; color: var(--accent); font: 600 .9rem var(--body); cursor: pointer; padding: 4px 0; }
.matchcount { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* List */
.list-section { display: flex; flex-direction: column; gap: 14px; }
.add { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; min-width: 0; font: 500 1rem var(--body); padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.add-row button { border: 0; background: var(--ink); color: var(--bg); font: 600 1rem var(--body); padding: 0 18px; border-radius: 10px; cursor: pointer; }
.add .chip { font-size: .82rem; padding: 5px 11px; }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }
ul.ideas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.ideas li { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.idea-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.idea-name { font-weight: 600; overflow-wrap: anywhere; }
.idea-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.idea-tags .tag { font-size: .7rem; padding: 1px 7px; }
.mine { font-size: .7rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
.del { border: 0; background: transparent; color: var(--muted); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.3rem; line-height: 1; flex: none; }
.del:hover { background: var(--chip); color: var(--accent); }
.list-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.status { font-size: .8rem; color: var(--muted); }
.empty { color: var(--muted); padding: 12px 0; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 14px 18px; cursor: pointer; font: 600 1.05rem var(--body); text-align: left; }
.toggle:hover { border-color: var(--muted); }
.toggle-right { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .9rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.caret { font-size: 1.1rem; transition: transform .15s ease; }
.toggle[aria-expanded="true"] .caret { transform: rotate(180deg); }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }

button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .go { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>What to do<span class="q">?</span></h1>
    <p class="sub">Can't decide? Let the ticket pick.</p>
  </header>

  <div class="modes" role="group" aria-label="What are you looking for">
    <button id="mode-food" type="button" aria-pressed="true" data-mode="food">Restaurants</button>
    <button id="mode-act" type="button" aria-pressed="false" data-mode="act">Dates &amp; activities</button>
  </div>

  <section class="ticket" aria-live="polite">
    <span class="ticket-label" id="ticket-label">Tonight we're eating…</span>
    <div class="result">
      <p class="result-name idle" id="result-name">Tap the button to get an idea</p>
      <div class="result-tags" id="result-tags"></div>
    </div>
    <button class="go" id="go" type="button">Pick something</button>
    <span class="result-meta" id="result-meta"></span>
  </section>

  <section class="filters" id="filters" hidden>
    <div class="filters-head">
      <h2>Narrow it down</h2>
      <button class="link" id="clear-filters" type="button">Clear filters</button>
    </div>
    <div id="filter-groups" class="filters"></div>
    <span class="matchcount" id="matchcount"></span>
  </section>

  <section class="list-section">
    <button class="toggle" id="toggle-list" type="button" aria-expanded="false" aria-controls="list-body">
      <span id="list-title">Restaurant ideas</span>
      <span class="toggle-right"><span id="list-count"></span><span class="caret" aria-hidden="true">▾</span></span>
    </button>
    <div id="list-body" class="list-section" hidden>
    <form class="add" id="add-form" autocomplete="off">
      <div class="add-row">
        <input id="add-name" aria-label="New idea" type="text" maxlength="80" placeholder="Add an idea…">
        <button type="submit">Add</button>
      </div>
      <div id="add-tags" class="filters"></div>
      <p class="hint">Tag it so filters can find it. Leave a group blank and it fits any choice.</p>
    </form>
    <ul class="ideas" id="ideas"></ul>
    <div class="list-foot">
      <button class="link" id="restore" type="button">Bring back deleted starter ideas</button>
      <span class="status" id="status"></span>
    </div>
    </div>
  </section>
</div>

<script>
const GROUPS = {
  food: [
    { key: "meal", name: "Meal", opts: [["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"]] },
    { key: "dist", name: "Distance", opts: [["close","Close"],["far","Far"]] },
    { key: "season", name: "Season", opts: [["summer","Summer"],["winter","Winter"]] },
  ],
  act: [
    { key: "where", name: "Setting", opts: [["inside","Inside"],["outside","Outside"]] },
    { key: "time", name: "Time of day", opts: [["day","Day"],["night","Night"]] },
    { key: "dist", name: "Distance", opts: [["close","Close"],["far","Far"]] },
    { key: "season", name: "Season", opts: [["summer","Summer"],["winter","Winter"]] },
  ],
};
const LABEL = {};
for (const m in GROUPS) for (const g of GROUPS[m]) for (const [v,l] of g.opts) LABEL[g.key+":"+v] = l;

// Stock ideas. Tags are "group:value"; a group left untagged fits any filter in that group.
const STOCK = [
  ["food","Diner breakfast at the counter",["meal:breakfast","dist:close"]],
  ["food","Bagels and coffee to go",["meal:breakfast","dist:close"]],
  ["food","Fancy brunch with mimosas",["meal:breakfast","meal:lunch"]],
  ["food","Dim sum",["meal:breakfast","meal:lunch"]],
  ["food","Pancake house",["meal:breakfast"]],
  ["food","Taco truck",["meal:lunch","meal:dinner","season:summer"]],
  ["food","Sandwich shop and eat in the park",["meal:lunch","season:summer","dist:close"]],
  ["food","Lobster roll by the water",["meal:lunch","season:summer","dist:far"]],
  ["food","Pho or a big bowl of ramen",["meal:lunch","meal:dinner","season:winter"]],
  ["food","Neighborhood pizza place",["meal:lunch","meal:dinner","dist:close"]],
  ["food","Rooftop dinner",["meal:dinner","season:summer"]],
  ["food","Patio seafood dinner",["meal:dinner","season:summer"]],
  ["food","Cozy Italian with candles",["meal:dinner","season:winter"]],
  ["food","Hot pot",["meal:dinner","season:winter"]],
  ["food","Fondue night",["meal:dinner","season:winter"]],
  ["food","Tasting menu splurge",["meal:dinner","dist:far"]],
  ["food","Thai takeout",["meal:dinner","dist:close"]],
  ["food","Cuisine you've never tried",["meal:lunch","meal:dinner","dist:far"]],
  ["food","Ice cream for dinner",["meal:dinner","season:summer","dist:close"]],
  ["food","Day trip to a small-town diner",["meal:breakfast","meal:lunch","dist:far"]],

  ["act","Picnic in the park",["time:day","where:outside","season:summer","dist:close"]],
  ["act","Sunset walk",["time:night","where:outside","dist:close"]],
  ["act","Beach day",["time:day","where:outside","season:summer","dist:far"]],
  ["act","Day hike",["time:day","where:outside","dist:far"]],
  ["act","Bike ride on a new route",["time:day","where:outside","season:summer"]],
  ["act","Apple or berry picking",["time:day","where:outside","season:summer","dist:far"]],
  ["act","Ice skating",["where:outside","season:winter"]],
  ["act","Sledding",["time:day","where:outside","season:winter","dist:close"]],
  ["act","Farmers market",["time:day","where:outside","season:summer","dist:close"]],
  ["act","Outdoor concert",["time:night","where:outside","season:summer"]],
  ["act","Museum afternoon",["time:day","where:inside"]],
  ["act","Live jazz at a club",["time:night","where:inside"]],
  ["act","Movie at a theater",["where:inside","dist:close"]],
  ["act","Board game night",["time:night","where:inside","dist:close","season:winter"]],
  ["act","Cook a new recipe together",["time:night","where:inside","dist:close"]],
  ["act","Bowling",["where:inside"]],
  ["act","Pottery or painting class",["where:inside"]],
  ["act","Aquarium",["time:day","where:inside","dist:far"]],
  ["act","Bookstore browse plus coffee",["time:day","where:inside","dist:close","season:winter"]],
  ["act","Weekend away somewhere new",["dist:far"]],
  ["act","Comedy show",["time:night","where:inside"]],
  ["act","Stargazing",["time:night","where:outside","dist:far"]],
].map(([cat,name,tags], i) => ({ id: "s" + i, cat, name, tags, stock: true }));

let state = { added: [], removed: [] };
let mode = "food";
const filters = { food: new Set(), act: new Set() };
const addTags = new Set();
let revealed = false;
let listOpen = false;
let lastPick = { food: null, act: null };
let store = null; // { save(state) }

const $ = id => document.getElementById(id);

function allIdeas(cat) {
  const removed = new Set(state.removed);
  return STOCK.filter(i => i.cat === cat && !removed.has(i.id)).concat(state.added.filter(i => i.cat === cat));
}
function matches(idea) {
  const sel = filters[mode];
  for (const g of GROUPS[mode]) {
    const picked = g.opts.map(o => g.key + ":" + o[0]).filter(t => sel.has(t));
    if (!picked.length) continue;
    const own = idea.tags.filter(t => t.startsWith(g.key + ":"));
    if (!own.length) continue;
    if (!picked.some(t => own.includes(t))) return false;
  }
  return true;
}
function tagHTML(t) { return `<span class="tag">${esc(LABEL[t] || t)}</span>`; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function chipGroups(set, idPrefix) {
  return GROUPS[mode].map(g => `
    <div class="group">
      <span class="group-name">${g.name}</span>
      <div class="chips">${g.opts.map(([v,l]) => {
        const t = g.key + ":" + v;
        return `<button type="button" class="chip" id="${idPrefix}-${mode}-${g.key}-${v.replace(/\$/g,"d")}" data-tag="${esc(t)}" aria-pressed="${set.has(t)}">${esc(l)}</button>`;
      }).join("")}</div>
    </div>`).join("");
}

function render() {
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  $("ticket-label").textContent = mode === "food" ? "Tonight we're eating…" : "Let's go do…";
  $("list-title").textContent = (listOpen ? "Hide " : "Edit ") + (mode === "food" ? "restaurant ideas" : "date & activity ideas");
  $("toggle-list").setAttribute("aria-expanded", listOpen);
  $("list-body").hidden = !listOpen;
  $("filters").hidden = !revealed;
  $("filter-groups").innerHTML = chipGroups(filters[mode], "f");
  $("add-tags").innerHTML = chipGroups(addTags, "a");
  const all = allIdeas(mode);
  const n = all.filter(matches).length;
  $("matchcount").textContent = `${n} of ${all.length} ideas match`;
  $("list-count").textContent = `${all.length}`;
  $("ideas").innerHTML = all.length ? all.map(i => `
    <li data-key="${i.id}">
      <div class="idea-main">
        <span class="idea-name">${esc(i.name)}</span>
        <div class="idea-tags">${i.stock ? "" : `<span class="mine">Yours</span>`}${i.tags.map(tagHTML).join("")}</div>
      </div>
      <button class="del" type="button" data-del="${i.id}" aria-label="Delete ${esc(i.name)}">×</button>
    </li>`).join("") : `<li class="empty">No ideas yet. Add one above.</li>`;
  const removedHere = STOCK.filter(s => s.cat === mode && state.removed.includes(s.id)).length;
  $("restore").hidden = removedHere === 0;
  showPick(lastPick[mode]);
}

function showPick(idea, rolling) {
  const name = $("result-name");
  if (!idea) {
    name.className = "result-name idle";
    name.textContent = "Tap the button to get an idea";
    $("result-tags").innerHTML = "";
    return;
  }
  name.className = "result-name" + (rolling ? " rolling" : "");
  name.textContent = idea.name;
  $("result-tags").innerHTML = rolling ? "" : idea.tags.map(tagHTML).join("");
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let spinning = false;
function pick() {
  if (spinning) return;
  const firstTime = !revealed;
  revealed = true;
  const pool = allIdeas(mode).filter(matches);
  if (!pool.length) {
    lastPick[mode] = null;
    render();
    $("result-name").className = "result-name idle";
    $("result-name").textContent = "Nothing matches those filters";
    $("result-meta").textContent = "Try clearing a filter or two.";
    return;
  }
  let choices = pool.length > 1 ? pool.filter(i => i !== lastPick[mode]) : pool;
  const winner = choices[Math.floor(Math.random() * choices.length)];
  if (firstTime) render();
  $("result-meta").textContent = `Picked from ${pool.length} idea${pool.length === 1 ? "" : "s"}`;
  if (reduce || pool.length < 2) { lastPick[mode] = winner; showPick(winner); return; }
  spinning = true;
  let steps = 14, delay = 40;
  const tick = () => {
    if (steps-- <= 0) { spinning = false; lastPick[mode] = winner; showPick(winner); return; }
    showPick(pool[Math.floor(Math.random() * pool.length)], true);
    delay *= 1.15;
    setTimeout(tick, delay);
  };
  tick();
}

document.addEventListener("click", e => {
  const m = e.target.closest(".modes button");
  if (m) { mode = m.dataset.mode; addTags.clear(); $("result-meta").textContent = ""; render(); return; }
  const chip = e.target.closest(".chip");
  if (chip) {
    const set = chip.closest("#add-tags") ? addTags : filters[mode];
    const t = chip.dataset.tag;
    set.has(t) ? set.delete(t) : set.add(t);
    render();
    return;
  }
  const del = e.target.closest("[data-del]");
  if (del) {
    const id = del.dataset.del;
    if (id.startsWith("s")) state.removed = [...state.removed, id];
    else state.added = state.added.filter(i => i.id !== id);
    if (lastPick[mode] && lastPick[mode].id === id) lastPick[mode] = null;
    render(); save();
  }
});
$("go").addEventListener("click", pick);
$("toggle-list").addEventListener("click", () => { listOpen = !listOpen; render(); });
$("clear-filters").addEventListener("click", () => { filters[mode].clear(); render(); });
$("restore").addEventListener("click", () => {
  const ids = new Set(STOCK.filter(s => s.cat === mode).map(s => s.id));
  state.removed = state.removed.filter(id => !ids.has(id));
  render(); save();
});
$("add-form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("add-name").value.trim();
  if (!name) { $("add-name").focus(); return; }
  state.added = [...state.added, { id: "u" + Date.now().toString(36) + Math.random().toString(36).slice(2,6), cat: mode, name, tags: [...addTags] }];
  $("add-name").value = "";
  addTags.clear();
  render(); save();
  $("add-name").focus();
});

function clean(s) {
  return {
    added: Array.isArray(s && s.added) ? s.added.filter(i => i && typeof i.name === "string" && (i.cat === "food" || i.cat === "act")).map(i => ({ id: String(i.id), cat: i.cat, name: i.name.slice(0, 80), tags: Array.isArray(i.tags) ? i.tags.filter(t => LABEL[t]) : [] })) : [],
    removed: Array.isArray(s && s.removed) ? s.removed.filter(x => typeof x === "string") : [],
  };
}

// Storage: one shared list in JSONBin, with a copy in this browser as a fallback.
// The access key below is limited to reading and updating this one bin.
const JSONBIN = {
  url: "https://api.jsonbin.io/v3/b/6ac6f7c7ac6210605a1e2776",
  key: "$2a$10$yfpA2FsA3HuoHFsNxjhlA.01wYbtbRcmKWHwYh7rMQo52udmy9HbG",
};
const LS_KEY = "what-to-do-v1";
const LS_UNSYNCED = "what-to-do-unsynced";
function lsSet(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

async function readBin() {
  const r = await fetch(JSONBIN.url + "/latest?meta=false", { headers: { "X-Access-Key": JSONBIN.key }, cache: "no-store" });
  if (!r.ok) throw new Error("read " + r.status);
  const data = await r.json();
  return clean(data && data.record ? data.record : data);
}
async function writeBin(s) {
  const r = await fetch(JSONBIN.url, { method: "PUT", headers: { "Content-Type": "application/json", "X-Access-Key": JSONBIN.key }, body: JSON.stringify(s) });
  if (!r.ok) throw new Error("write " + r.status);
}

let chain = Promise.resolve();
let pending = 0;
store = {
  save: s => {
    const copy = JSON.parse(JSON.stringify(s));
    lsSet(LS_KEY, JSON.stringify(copy));
    lsSet(LS_UNSYNCED, "1");
    pending++;
    chain = chain.catch(() => {}).then(() => writeBin(copy)).then(
      () => { if (--pending === 0) lsSet(LS_UNSYNCED, null); },
      err => { pending--; throw err; }
    );
    return chain;
  },
};

function save() {
  $("status").textContent = "Saving…";
  store.save(state).then(() => { if (!pending) $("status").textContent = "Saved"; })
    .catch(() => { $("status").textContent = "Couldn't reach your online list. Saved on this device; it will sync with your next change."; });
}

try { const raw = lsGet(LS_KEY); if (raw) state = clean(JSON.parse(raw)); } catch (e) {}
render();

async function syncFromBin() {
  if (pending) return;
  try {
    if (lsGet(LS_UNSYNCED)) {
      // Changes made while offline: send them up instead of overwriting them.
      await store.save(state);
      $("status").textContent = "Synced";
      return;
    }
    const remote = await readBin();
    if (pending) return;
    state = remote;
    lsSet(LS_KEY, JSON.stringify(state));
    render();
    $("status").textContent = "Synced";
  } catch (e) {
    $("status").textContent = "Couldn't reach your online list. Showing the copy saved on this device.";
  }
}
syncFromBin();
// Pick up changes made on another device when you come back to the app.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncFromBin(); });
</script>
</body>
</html>
